services:
  db:
    image: postgres:16-alpine
    container_name: deckard-db
    environment:
      POSTGRES_USER: deckard
      POSTGRES_PASSWORD: deckard
      POSTGRES_DB: deckard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckard -d deckard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: deckard-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://deckard:deckard@db:5432/deckard
      JWT_SECRET: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
